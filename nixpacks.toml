# Nixpacks build plan for Railway. Builds and starts the @biz-checks/api
# workspace from the monorepo root. Postgres + Redis come from sibling
# Railway services and are wired in via DATABASE_URL / REDIS_URL.

providers = ["node"]

[phases.setup]
nixPkgs = ["nodejs_20", "openssl", "python3", "gcc"]

[phases.install]
# Force-install devDependencies — Railway sets NODE_ENV=production at the
# service level, which causes pnpm to skip devDeps. We need them (typescript,
# prisma CLI, tsx) to build the api.
cmds = [
  "corepack enable",
  "corepack prepare pnpm@9.12.3 --activate",
  "pnpm install --frozen-lockfile --prod=false",
]

[phases.build]
cmds = [
  "pnpm --filter @biz-checks/api... build",
]

[start]
cmd = "pnpm --filter @biz-checks/api start:prod"
